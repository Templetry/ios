# XcodeGen spec. The .xcodeproj is generated from this, never committed:
# a pbxproj is a merge-conflict machine, and this file is reviewable.
#
#   brew install xcodegen && xcodegen generate
name: TemplateApp

options:
  bundleIdPrefix: com.template
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

# tpl:if environments
# The three environment profiles (ADR-0018) as Xcode's own mechanism: one
# build configuration each. Development maps to a debug build, the other two
# to release, which is what makes staging genuinely production-like.
configs:
  Development: debug
  Staging: release
  Production: release
# tpl:endif

settings:
  base:
    # Swift 5 language mode. Moving to 6 turns strict concurrency checking
    # from warnings into errors — a deliberate migration, not a default.
    SWIFT_VERSION: "5.0"
    # No signing identity exists on CI, and a simulator build needs none.
    CODE_SIGNING_ALLOWED: "NO"
  # tpl:if environments
  # AppConfig reads these with #if, and raises #error when none is set — so
  # a configuration that lost its flag fails the build rather than quietly
  # shipping the wrong profile.
  configs:
    Development:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG ENV_DEVELOPMENT"
    Staging:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "ENV_STAGING"
    Production:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "ENV_PRODUCTION"
  # tpl:endif

targets:
  TemplateApp:
    type: application
    platform: iOS
    # Sources are globbed from disk, so a feature that adds or removes files
    # needs no change here — the project spec stays out of the way.
    sources:
      - path: Sources/TemplateApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.template.templateapp
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: "YES"
        TARGETED_DEVICE_FAMILY: "1,2"

  TemplateAppTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/TemplateAppTests
    dependencies:
      - target: TemplateApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.template.templateapp.tests

schemes:
  TemplateApp:
    build:
      targets:
        TemplateApp: all
        TemplateAppTests: [test]
    # tpl:if environments
    # Named explicitly: with custom configurations there is no Debug/Release
    # for Xcode to fall back on.
    run:
      config: Development
    test:
      config: Development
      targets:
        - TemplateAppTests
    profile:
      config: Production
    analyze:
      config: Development
    archive:
      config: Production
    # tpl:endif
    # tpl:if !environments
    test:
      targets:
        - TemplateAppTests
    # tpl:endif
